<style>
:root{
  --bg:#fbfbfa;
  --bg-sub:#f2f2f0;
  --card:#ffffff;
  --ink:#1d1d1f;
  --sub:#6e6e73;
  --muted:#a1a1a6;
  --line:rgba(0,0,0,.08);
  --line-strong:rgba(0,0,0,.14);
  --acc:#8b4a2f;
  --acc-soft:rgba(139,74,47,.1);
  --acc-ink:#ffffff;
  --danger:#c93b3b;
  --danger-soft:rgba(201,59,59,.1);
  --sh-book:0 2px 6px rgba(0,0,0,.06), 0 12px 28px rgba(0,0,0,.09);
  --sh-card:0 1px 3px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
  --sh-modal:0 20px 60px rgba(0,0,0,.24);
  --r-lg:16px;
  --r-md:12px;
  --r-sm:8px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000000;
    --bg-sub:#1c1c1e;
    --card:#1c1c1e;
    --ink:#f5f5f7;
    --sub:#98989d;
    --muted:#636366;
    --line:rgba(255,255,255,.1);
    --line-strong:rgba(255,255,255,.18);
    --acc:#c87a59;
    --acc-soft:rgba(200,122,89,.18);
    --acc-ink:#ffffff;
    --danger:#ff5c5c;
    --danger-soft:rgba(255,92,92,.15);
    --sh-book:0 4px 12px rgba(0,0,0,.45), 0 16px 36px rgba(0,0,0,.55);
    --sh-card:0 2px 10px rgba(0,0,0,.35);
    --sh-modal:0 24px 70px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden}
body{
  background:var(--bg);
  color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Yu Gothic UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  font-weight:600;
  letter-spacing:.02em;
}
.ico{
  width:18px;height:18px;
  stroke:currentColor;stroke-width:1.85;
  stroke-linecap:round;stroke-linejoin:round;
  fill:none;flex:none;
}

/* Header */
header{
  position:sticky;top:0;z-index:20;
  background:rgba(251,251,250,.82);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
}
@media (prefers-color-scheme:dark){
  header{background:rgba(0,0,0,.78)}
}
.hbar{
  max-width:980px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.brand{
  display:flex;align-items:center;gap:10px;cursor:pointer;
  margin:0;font-size:19px;letter-spacing:.04em;white-space:nowrap;
}
.brand-mark{
  width:32px;height:32px;border-radius:9px;
  background:var(--acc);color:#fff;
  display:grid;place-items:center;flex:none;
}
.brand-mark svg{width:18px;height:18px;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;fill:none}
.brand small{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
  font-size:12px;font-weight:600;color:var(--sub);
  background:var(--bg-sub);padding:2px 9px;border-radius:99px;
  letter-spacing:0;font-variant-numeric:tabular-nums;
}
.hacts{display:flex;align-items:center;gap:8px}
.icon-btn{
  width:38px;height:38px;min-height:38px;padding:0;border-radius:99px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;
}
.add-btn{
  height:38px;min-height:38px;padding:0 14px;border-radius:99px;
  background:var(--acc);color:var(--acc-ink);border:none;
  font-size:13.5px;font-weight:600;gap:5px;
}

/* Main Container */
main{
  max-width:980px;margin:0 auto;
  padding:18px 16px calc(48px + env(safe-area-inset-bottom,0px));
}

/* Buttons & Inputs */
button,a.btn{
  font:inherit;cursor:pointer;color:var(--ink);text-decoration:none;
  background:var(--card);border:1px solid var(--line-strong);
  border-radius:var(--r-md);padding:9px 15px;min-height:40px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .12s ease,opacity .15s ease,background .15s ease,border-color .15s ease;
}
button:active,a.btn:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:default;transform:none}
button.primary,a.btn.primary{background:var(--acc);color:var(--acc-ink);border-color:transparent;font-weight:600}
button.ghost{background:transparent;border-color:transparent;color:var(--sub)}
button.danger{color:var(--danger);border-color:var(--danger-soft)}
button.danger.primary{background:var(--danger);color:#fff;border-color:transparent}
button:focus-visible,a.btn:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--acc);outline-offset:2px;
}

input[type=text],input[type=search],select{
  width:100%;font:inherit;color:var(--ink);
  background:var(--card);border:1px solid var(--line-strong);
  border-radius:var(--r-md);padding:10px 13px;min-height:42px;
  transition:border-color .15s ease;
}
@media (prefers-color-scheme:dark){
  input[type=text],input[type=search],select{background:var(--bg-sub)}
}
select{width:auto;padding:8px 12px;font-size:13.5px}

/* Toolbar */
.tools{display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
.srow{display:flex;gap:8px;align-items:center}
.search-wrap{position:relative;flex:1;display:flex;align-items:center;min-width:0}
.search-wrap .ico{position:absolute;left:13px;color:var(--muted);pointer-events:none;width:16px;height:16px}
.search-wrap input{
  padding-left:36px;padding-right:34px;border-radius:99px;
  background:var(--bg-sub);border-color:transparent;
}
.search-wrap input:focus{background:var(--card);border-color:var(--line-strong)}
.q-clear{
  position:absolute;right:6px;width:28px;height:28px;min-height:28px;
  padding:0;border:none;background:none;color:var(--muted);border-radius:50%;font-size:13px;
}
.q-clear[hidden]{display:none}
.view-btn{
  width:42px;height:42px;min-height:42px;padding:0;flex:none;border-radius:var(--r-md);
  color:var(--sub);
}
.view-btn.on{color:var(--acc);background:var(--acc-soft);border-color:transparent}

.tags{
  display:flex;gap:7px;overflow-x:auto;padding:2px 0;scrollbar-width:none;
}
.tags[hidden]{display:none}
.tags::-webkit-scrollbar{display:none}
.tag{
  flex:none;font-size:13px;padding:5px 13px;min-height:32px;
  border-radius:99px;border:1px solid var(--line);
  background:transparent;color:var(--sub);font-weight:500;
}
.tag.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.tag b{font-size:11px;opacity:.65;margin-left:4px;font-weight:600;font-variant-numeric:tabular-nums}

/* Bookshelf Grid */
.shelf{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(146px,1fr));
  gap:28px 18px;
}
@media (min-width:640px){
  .shelf{grid-template-columns:repeat(auto-fill,minmax(174px,1fr));gap:34px 24px}
}
.book{
  background:none;border:none;padding:0;min-height:auto;
  display:flex;flex-direction:column;align-items:stretch;text-align:left;
  border-radius:0;cursor:pointer;
}
.book:active{transform:scale(.98)}
.cover-wrap{
  position:relative;width:100%;aspect-ratio:3/4;
  border-radius:4px 10px 10px 4px;
  overflow:hidden;
  box-shadow:var(--sh-book);
  transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease;
  background:#ffffff;
}
.book:hover .cover-wrap{transform:translateY(-4px)}
.cover-wrap::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,
    rgba(255,255,255,.22) 0%,
    rgba(0,0,0,.14) 2.2%,
    rgba(255,255,255,.1) 4.2%,
    rgba(0,0,0,0) 9%);
  border-radius:inherit;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
}
.cover-wrap img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.gen-cover{
  width:100%;height:100%;padding:20px 16px 16px 20px;
  display:flex;flex-direction:column;justify-content:space-between;
  background:#2d2f31;color:#f5f5f7;
}
.gen-cover-band{width:28px;height:2px;background:currentColor;opacity:.45;margin-bottom:10px}
.gen-cover-title{
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  font-size:15px;line-height:1.45;font-weight:600;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
  overflow-wrap:anywhere;
}
.fav-dot{
  position:absolute;top:8px;right:8px;z-index:2;
  width:24px;height:24px;border-radius:50%;
  background:rgba(0,0,0,.48);backdrop-filter:blur(6px);
  color:#ffd15c;display:grid;place-items:center;font-size:12px;
}
.book-meta{padding:10px 2px 0;display:flex;flex-direction:column;gap:2px}
.book-title{
  font-size:14px;font-weight:600;line-height:1.35;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  overflow-wrap:anywhere;
}
.book-sub{
  font-size:12px;color:var(--sub);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* List View */
.shelf.list-view{grid-template-columns:1fr;gap:10px}
@media (min-width:700px){
  .shelf.list-view{grid-template-columns:repeat(2,1fr);gap:12px 16px}
}
.shelf.list-view .book{
  flex-direction:row;align-items:center;gap:14px;
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-md);padding:10px 12px;
  box-shadow:var(--sh-card);
}
.shelf.list-view .cover-wrap{
  width:52px;height:70px;aspect-ratio:auto;flex:none;
  border-radius:3px 6px 6px 3px;box-shadow:0 2px 6px rgba(0,0,0,.12);
}
.shelf.list-view .book:hover .cover-wrap{transform:none}
.shelf.list-view .gen-cover{padding:6px 5px 5px 7px}
.shelf.list-view .gen-cover-band{display:none}
.shelf.list-view .gen-cover-title{font-size:8.5px;-webkit-line-clamp:3;line-height:1.25}
.shelf.list-view .fav-dot{width:18px;height:18px;font-size:10px;top:3px;right:3px}
.shelf.list-view .book-meta{padding:0;flex:1;min-width:0;gap:3px}
.shelf.list-view .book-title{font-size:15px;-webkit-line-clamp:1}

/* Views */
.view{display:none;animation:fadeUp .18s ease}
.view.show{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.empty{
  padding:64px 20px;text-align:center;color:var(--sub);
  border:1px dashed var(--line-strong);border-radius:var(--r-lg);
}
.empty[hidden]{display:none}
.empty p{margin:0 0 18px;font-size:15px}

/* Detail View */
.bar{display:flex;align-items:center;gap:8px;margin-bottom:20px}
.bar .sp{flex:1}
.detail-hero{
  display:grid;grid-template-columns:132px 1fr;gap:20px;align-items:start;
  margin-bottom:24px;
}
@media (min-width:640px){
  .detail-hero{grid-template-columns:180px 1fr;gap:28px}
}
.detail-cover{
  display:block;width:100%;aspect-ratio:3/4;border-radius:5px 12px 12px 5px;
  overflow:hidden;box-shadow:var(--sh-book);position:relative;background:#fff;
  text-decoration:none;color:inherit;
}
.detail-cover::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,.22) 0%,rgba(0,0,0,.14) 2.2%,rgba(255,255,255,.1) 4.2%,rgba(0,0,0,0) 9%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
}
.detail-cover img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.detail-info{min-width:0}
.detail-info h2{margin:0 0 8px;font-size:22px;line-height:1.35;overflow-wrap:anywhere}
.detail-meta{font-size:12.5px;color:var(--muted);margin:0;font-variant-numeric:tabular-nums}
.pdf-acts{display:flex;gap:10px;margin-bottom:24px}
.pdf-acts .primary{flex:1;min-height:48px;font-size:15.5px}
.missing-pdf{
  padding:12px 14px;border-radius:var(--r-md);
  background:var(--danger-soft);color:var(--danger);
  font-size:13.5px;font-weight:500;margin-bottom:18px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
}
.detail-foot{
  display:flex;gap:10px;justify-content:flex-end;
  margin-top:28px;padding-top:16px;border-top:1px solid var(--line);
}

/* Form View */
.form-wrap{max-width:600px;margin:0 auto}
.form-wrap h2{margin:0 0 18px;font-size:22px}
label.flbl{display:block;font-size:13px;font-weight:600;color:var(--sub);margin:16px 0 6px}
.pdf-drop{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;border-radius:var(--r-md);
  border:1.5px dashed var(--line-strong);background:var(--card);
  cursor:pointer;transition:border-color .15s,background .15s;
}
.pdf-drop.has-file{border-style:solid;border-color:var(--acc);background:var(--acc-soft)}
.pdf-thumb{
  width:52px;height:68px;border-radius:3px 6px 6px 3px;overflow:hidden;flex:none;
  background:var(--bg-sub);box-shadow:0 2px 6px rgba(0,0,0,.12);
  display:grid;place-items:center;color:var(--muted);font-size:11px;
}
.pdf-thumb img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.pdf-drop-info{min-width:0;flex:1}
.pdf-drop-name{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdf-drop-size{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.fbar{
  position:sticky;bottom:0;z-index:10;
  display:flex;gap:10px;
  padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));
  background:var(--bg);margin-top:22px;border-top:1px solid var(--line);
}
.fbar .primary{flex:1;min-height:46px}

/* Overlay / Sheet / Dialog */
.ov{
  position:fixed;inset:0;z-index:90;
  background:rgba(0,0,0,.42);backdrop-filter:blur(4px);

</style>
</head>

<div id="toast" role="status"></div>

<script>
(function(){
"use strict";
var DB_NAME="recipe-shelf-db", DB_VER=1, ST_META="meta", ST_PDFS="pdfs";
var PDFJS_CDN="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";

var db=null, books=[], viewMode="grid", sortMode="opened", favOnly=false;
var curView="vShelf", curId=null, editingId=null, lastExported=0;
var formPdfFile=null, formPdfBuf=null, formCover="";
var curDetailBlobUrl="";

var pdfjsReady=false, pdfjsLoading=null;
var $=function(id){return document.getElementById(id)};

// ---- Dynamic PDF.js Loader (cover thumbnail generation only) ----
function loadPdfJs(cb){
  if(window.pdfjsLib){
    if(!pdfjsReady){
      pdfjsReady=true;
      try{window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_CDN+"pdf.worker.min.js"}catch(e){}
    }
    cb(window.pdfjsLib);
    return;
  }
  if(pdfjsLoading){pdfjsLoading.push(cb);return}
  pdfjsLoading=[cb];
  var s=document.createElement("script");
  s.src=PDFJS_CDN+"pdf.min.js";
  s.async=true;
  s.onload=function(){
    pdfjsReady=true;
    try{window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_CDN+"pdf.worker.min.js"}catch(e){}
    var q=pdfjsLoading;pdfjsLoading=null;
    q.forEach(function(fn){fn(window.pdfjsLib)});
  };
  s.onerror=function(){
    var q=pdfjsLoading;pdfjsLoading=null;
    q.forEach(function(fn){fn(null)});
  };
  document.head.appendChild(s);
}

function openPdfDocument(lib,arrayBuf,cb){
  var dataCopy=new Uint8Array(arrayBuf.slice(0));
  var opts={
    data:dataCopy,
    cMapUrl:PDFJS_CDN+"cmaps/",
    cMapPacked:true,
    standardFontDataUrl:PDFJS_CDN+"standard_fonts/",
    disableWorker:(location.protocol==="file:")
  };
  lib.getDocument(opts).promise.then(function(doc){
    cb(doc);
  }).catch(function(){
    if(!opts.disableWorker){
      var retryCopy=new Uint8Array(arrayBuf.slice(0));
      opts.data=retryCopy;
      opts.disableWorker=true;
      lib.getDocument(opts).promise.then(function(doc){cb(doc)}).catch(function(){cb(null)});
    }else{
      cb(null);
    }
  });
}

function generateCoverFromBuffer(arrayBuf,cb){
  loadPdfJs(function(lib){
    if(!lib){cb("");return}
    openPdfDocument(lib,arrayBuf,function(doc){
      if(!doc){cb("");return}
      doc.getPage(1).then(function(page){
        var vp0=page.getViewport({scale:1});
        var targetW=480;
        var scale=Math.min(2,targetW/Math.max(1,vp0.width));
        var vp=page.getViewport({scale:scale});
        var c=document.createElement("canvas");
        c.width=Math.round(vp.width);
        c.height=Math.round(vp.height);
        var ctx=c.getContext("2d");
        ctx.fillStyle="#ffffff";
        ctx.fillRect(0,0,c.width,c.height);
        page.render({canvasContext:ctx,viewport:vp}).promise.then(function(){
          var uri="";
          try{uri=c.toDataURL("image/jpeg",.82)}catch(e){}
          try{doc.destroy()}catch(e){}
          cb(uri);
        }).catch(function(){try{doc.destroy()}catch(e){}cb("")});
      }).catch(function(){try{doc.destroy()}catch(e){}cb("")});
    });
  });
}

// ---- IndexedDB (2 stores: meta + pdfs) ----
function openDB(cb){
  if(!window.indexedDB){cb(null);return}
  try{
    var req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=function(e){
      var d=e.target.result;
      if(!d.objectStoreNames.contains(ST_META))d.createObjectStore(ST_META);
      if(!d.objectStoreNames.contains(ST_PDFS))d.createObjectStore(ST_PDFS);
    };
    req.onsuccess=function(e){db=e.target.result;cb(db)};
    req.onerror=function(){cb(null)};
  }catch(e){cb(null)}
}
function metaPut(k,v,cb){
  if(!db){if(cb)cb(false);return}
  try{
    var tx=db.transaction(ST_META,"readwrite");
    tx.objectStore(ST_META).put(v,k);
    tx.oncomplete=function(){if(cb)cb(true)};
    tx.onerror=function(){if(cb)cb(false)};
  }catch(e){if(cb)cb(false)}
}
function metaGetAll(cb){
  if(!db){cb({});return}
  try{
    var tx=db.transaction(ST_META,"readonly"),st=tx.objectStore(ST_META),out={};
    ["books","viewMode","sortMode","lastExported"].forEach(function(k){
      var r=st.get(k);
      r.onsuccess=function(){out[k]=r.result};
    });
    tx.oncomplete=function(){cb(out)};
    tx.onerror=function(){cb({})};
  }catch(e){cb({})}
}
function pdfPut(id,rec,cb){
  if(!db){if(cb)cb(false);return}
  try{
    var tx=db.transaction(ST_PDFS,"readwrite");
    tx.objectStore(ST_PDFS).put(rec,id);
    tx.oncomplete=function(){if(cb)cb(true)};
    tx.onerror=function(){if(cb)cb(false)};
  }catch(e){if(cb)cb(false)}
}
function pdfGet(id,cb){
  if(!db){cb(null);return}
  try{
    var tx=db.transaction(ST_PDFS,"readonly");
    var r=tx.objectStore(ST_PDFS).get(id);
    r.onsuccess=function(){cb(r.result||null)};
    r.onerror=function(){cb(null)};
  }catch(e){cb(null)}
}
function pdfDelete(id,cb){
  if(!db){if(cb)cb();return}
  try{
    var tx=db.transaction(ST_PDFS,"readwrite");
    tx.objectStore(ST_PDFS).delete(id);
    tx.oncomplete=function(){if(cb)cb()};
    tx.onerror=function(){if(cb)cb()};
  }catch(e){if(cb)cb()}
}
function saveBooks(cb){metaPut("books",books,cb)}

// Backfill missing covers from saved PDFs
var backfillRunning=false;
function backfillCovers(){
  if(backfillRunning)return;
  var target=books.find(function(b){return !b.cover&&!b._triedCover});
  if(!target)return;
  backfillRunning=true;
  target._triedCover=true;
  pdfGet(target.id,function(rec){
    if(!rec||!rec.data){backfillRunning=false;backfillCovers();return}
    generateCoverFromBuffer(rec.data,function(uri){
      if(uri){
        target.cover=uri;
        saveBooks();
        if(curView==="vShelf")renderShelf();
        else if(curView==="vDetail"&&curId===target.id)renderDetail(target.id);
      }
      backfillRunning=false;
      backfillCovers();
    });
  });
}

// ---- Utilities ----
var tt;
function toast(m){
  var el=$("toast");
  el.textContent=m;
  el.className="on";
  clearTimeout(tt);
  tt=setTimeout(function(){el.className=""},2400);
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return "b"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function norm(s){return String(s==null?"":s).normalize("NFKC").toLowerCase()}
function fmtSize(bytes){
  if(!bytes)return "0 KB";
  if(bytes<1024*1024)return Math.max(1,Math.round(bytes/1024))+" KB";
  return (bytes/(1024*1024)).toFixed(1)+" MB";
}
function fmtDate(ts){
  if(!ts)return "";
  var d=new Date(ts);
  return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate();
}
function todayStr(){
  var d=new Date();
  return d.getFullYear()+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2);
}
function coverInnerHTML(b,isDetail){
  if(b.cover)return '<img src="'+esc(b.cover)+'" alt="">';
  var sz=isDetail?' style="font-size:17px"':"";
  return '<div class="gen-cover">'
    +'<div><div class="gen-cover-band"></div><div class="gen-cover-title"'+sz+'>'+esc(b.title)+'</div></div>'
    +'<div></div>'
    +'</div>';
}
function showView(id){
  curView=id;
  ["vShelf","vDetail","vForm"].forEach(function(v){$(v).classList.toggle("show",v===id)});
  window.scrollTo(0,0);
}

// ---- Shelf Render ----
function renderShelf(){
  var qv=$("q").value;
  $("qClear").hidden=!qv;
  var qs=norm(qv).split(/\s+/).filter(Boolean);

  var favCnt=books.filter(function(b){return b.fav}).length;
  var tb=$("tagBar");
  if(favCnt||favOnly){
    tb.hidden=false;
    tb.innerHTML='<button type="button" class="tag'+(!favOnly?" on":"")+'" data-all="1">すべて<b>'+books.length+'</b></button>'
      +'<button type="button" class="tag'+(favOnly?" on":"")+'" data-fav="1">★<b>'+favCnt+'</b></button>';
  }else{
    tb.hidden=true;
    tb.innerHTML="";
  }

  var list=books.filter(function(b){
    if(favOnly&&!b.fav)return false;
    if(!qs.length)return true;
    var hay=norm(b.title);
    return qs.every(function(w){return hay.indexOf(w)>=0});
  });

  list.sort(function(a,b){
    if(sortMode==="opened")return (b.openedAt||b.createdAt||0)-(a.openedAt||a.createdAt||0);
    if(sortMode==="title")return String(a.title||"").localeCompare(String(b.title||""),"ja");
    return (b.createdAt||0)-(a.createdAt||0);
  });

  var shelfEl=$("shelf");
  shelfEl.classList.toggle("list-view",viewMode==="list");
  $("btnView").classList.toggle("on",viewMode==="list");
  $("icoView").innerHTML=viewMode==="list"
    ?'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>'
    :'<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>';

  shelfEl.innerHTML=list.map(function(b){
    var fav=b.fav?'<span class="fav-dot" aria-label="お気に入り">★</span>':"";
    var sub=b.size?fmtSize(b.size):"";
    return '<button type="button" class="book" data-id="'+b.id+'">'
      +'<div class="cover-wrap">'+coverInnerHTML(b,false)+fav+'</div>'
      +'<div class="book-meta">'
      +'<div class="book-title">'+esc(b.title)+'</div>'
      +(sub?'<div class="book-sub">'+esc(sub)+'</div>':"")
      +'</div></button>';
  }).join("");

  var emptyEl=$("empty");
  emptyEl.hidden=list.length>0;
  if(!list.length){
    emptyEl.innerHTML=books.length
      ?'<p>該当するレシピ集がありません</p>'
      :'<p>まだレシピ集が登録されていません</p><button type="button" class="primary" id="emptyAdd">レシピ集を追加</button>';
  }

  var cntEl=$("bookCount");
  cntEl.hidden=!books.length;
  cntEl.textContent=(list.length!==books.length?list.length+" / ":"")+books.length+"冊";
  updateStorageStat();
}

function updateStorageStat(){
  var total=books.reduce(function(acc,b){return acc+(b.size||0)},0);
  $("storageStat").textContent=books.length+"冊 / "+fmtSize(total);
  $("exportLbl").textContent=lastExported?"バックアップを書き出す（前回 "+fmtDate(lastExported)+"）":"バックアップを書き出す";
}

// ---- Detail View ----
function renderDetail(id){
  var b=books.find(function(x){return x.id===id});
  if(!b){showView("vShelf");return}
  curId=b.id;

  if(curDetailBlobUrl){try{URL.revokeObjectURL(curDetailBlobUrl)}catch(e){}curDetailBlobUrl=""}

  pdfGet(b.id,function(rec){
    var hasPdf=!!(rec&&rec.data);
    if(hasPdf){
      var blob=new Blob([rec.data],{type:"application/pdf"});
      curDetailBlobUrl=URL.createObjectURL(blob);
      if(!b.cover&&!b._triedCover){
        b._triedCover=true;
        generateCoverFromBuffer(rec.data,function(uri){
          if(uri){b.cover=uri;saveBooks();if(curId===b.id&&curView==="vDetail")renderDetail(b.id)}
        });
      }
    }

    var metaParts=[];
    if(b.size)metaParts.push(fmtSize(b.size));
    if(b.openedAt)metaParts.push("最終閲覧 "+fmtDate(b.openedAt));
    else if(b.createdAt)metaParts.push("追加 "+fmtDate(b.createdAt));

    var missingHtml=hasPdf?"":'<div class="missing-pdf"><span>PDF本体がこの端末に未保存です</span><button type="button" class="primary" id="dReattach" style="min-height:34px;padding:4px 12px;font-size:13px">PDFを再紐付け</button></div>';

    var coverEl=hasPdf
      ?'<a class="detail-cover" id="dCoverTap" href="'+esc(curDetailBlobUrl)+'" target="_blank" rel="noopener">'+coverInnerHTML(b,true)+'</a>'
      :'<div class="detail-cover">'+coverInnerHTML(b,true)+'</div>';

    var openBtnHtml=hasPdf
      ?'<a class="btn primary" id="dOpen" href="'+esc(curDetailBlobUrl)+'" target="_blank" rel="noopener">'
        +'<svg class="ico" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>'
        +'<span>PDFを開く</span></a>'
      :'<button type="button" class="primary" disabled>'
        +'<svg class="ico" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>'
        +'<span>PDFを開く</span></button>';

    var h='<div class="bar">'
      +'<button type="button" class="ghost" id="dBack" style="padding-left:4px">← 本棚</button>'
      +'<span class="sp"></span>'
      +'<button type="button" id="dFav" style="min-width:44px">'+(b.fav?"★":"☆")+'</button>'
      +'<button type="button" id="dEdit">編集</button>'
      +'</div>'
      +missingHtml
      +'<div class="detail-hero">'
      +coverEl
      +'<div class="detail-info">'
      +'<h2>'+esc(b.title)+'</h2>'
      +'<p class="detail-meta">'+esc(metaParts.join(" ・ "))+'</p>'
      +'</div></div>'
      +'<div class="pdf-acts">'+openBtnHtml+'</div>'
      +'<div class="detail-foot"><button type="button" class="danger" id="dDel">この本を削除</button></div>';

    $("vDetail").innerHTML=h;

    $("dBack").onclick=function(){renderShelf();showView("vShelf")};
    $("dFav").onclick=function(){
      b.fav=!b.fav;
      saveBooks();
      $("dFav").textContent=b.fav?"★":"☆";
    };
    $("dEdit").onclick=function(){openForm(b.id)};

    var markOpened=function(){
      b.openedAt=Date.now();
      saveBooks();
    };
    if($("dOpen"))$("dOpen").onclick=markOpened;
    if($("dCoverTap"))$("dCoverTap").onclick=markOpened;
    if($("dReattach")){
      $("dReattach").onclick=function(){$("fReattach").click()};
    }
    $("dDel").onclick=function(){
      ask("「"+b.title+"」を本棚から削除しますか？","削除",function(){
        books=books.filter(function(x){return x.id!==b.id});
        saveBooks();
        pdfDelete(b.id);
        renderShelf();
        showView("vShelf");
        toast("削除しました");
      });
    };
    showView("vDetail");
  });
}

// ---- Form View ----
function updateFormThumb(){
  var th=$("pdfThumb");
  if(formCover){
    th.innerHTML='<img src="'+esc(formCover)+'" alt="">';
  }else{
    th.textContent="PDF";
  }
}
function openForm(id){
  editingId=id||null;
  formPdfFile=null;
  formPdfBuf=null;
  var b=id?books.find(function(x){return x.id===id}):null;
  $("formTitle").textContent=b?"レシピ集を編集":"レシピ集を追加";
  $("fTitle").value=b?b.title:"";
  formCover=b?(b.cover||""):"";

  if(b){
    $("pdfDrop").classList.add("has-file");
    $("pdfDropName").textContent=b.fileName||b.title+".pdf";
    $("pdfDropSize").textContent=b.size?fmtSize(b.size)+"（変更する場合のみ選択）":"";
  }else{
    $("pdfDrop").classList.remove("has-file");
    $("pdfDropName").textContent="PDFファイルを選択";
    $("pdfDropSize").textContent="";
  }
  updateFormThumb();
  showView("vForm");
}

// ---- Backup Export / Import ----
function triggerDownload(name,text,mime,doneMsg){
  var b=new Blob([text],{type:mime});
  var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
  if(doneMsg)toast(doneMsg);
}
function exportJson(name,text,doneMsg){
  var mime="application/json;charset=utf-8";
  var isLocal=location.protocol==="file:";
  if(isLocal&&window.File&&navigator.canShare&&navigator.share){
    try{
      var file=new File([text],name,{type:mime});
      if(navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:name}).then(function(){
          if(doneMsg)toast(doneMsg);
        }).catch(function(err){
          if(err&&err.name!=="AbortError")triggerDownload(name,text,mime,doneMsg);
        });
        return;
      }
    }catch(e){}
  }
  triggerDownload(name,text,mime,doneMsg);
}

// ---- Confirm Dialog ----
var dlgFn=null;
function ask(msg,yesTxt,fn){
  dlgFn=fn;
  $("dlgMsg").textContent=msg;
  $("dlgYes").textContent=yesTxt||"OK";
  $("dlg").hidden=false;
}
function closeDlg(){$("dlg").hidden=true;dlgFn=null}
$("dlgNo").onclick=closeDlg;
$("dlg").onclick=function(e){if(e.target===this)closeDlg()};
$("dlgYes").onclick=function(){var f=dlgFn;closeDlg();if(f)f()};

// ---- Events ----
$("brandHome").onclick=function(){favOnly=false;renderShelf();showView("vShelf")};
$("btnAdd").onclick=function(){openForm(null)};
$("btnMenu").onclick=function(){updateStorageStat();$("menuSheet").hidden=false};
$("menuClose").onclick=function(){$("menuSheet").hidden=true};
$("menuSheet").onclick=function(e){if(e.target===this)$("menuSheet").hidden=true};

$("q").oninput=renderShelf;
$("qClear").onclick=function(){$("q").value="";renderShelf();$("q").focus()};
$("sortSel").onchange=function(){sortMode=this.value;metaPut("sortMode",sortMode);renderShelf()};
$("btnView").onclick=function(){
  viewMode=(viewMode==="list")?"grid":"list";
  metaPut("viewMode",viewMode);
  renderShelf();
};
$("tagBar").onclick=function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.getAttribute("data-all")){favOnly=false;renderShelf();return}
  if(b.getAttribute("data-fav")){favOnly=!favOnly;renderShelf()}
};
$("shelf").onclick=function(e){
  var c=e.target.closest(".book");
  if(c)renderDetail(c.getAttribute("data-id"));
};
$("empty").onclick=function(e){
  if(e.target.id==="emptyAdd")openForm(null);
};

// Form events
$("pdfDrop").onclick=function(){$("fPdf").click()};
$("pdfDrop").onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();$("fPdf").click()}};
$("fPdf").onchange=function(){
  var f=this.files[0];this.value="";if(!f)return;
  formPdfFile=f;
  formPdfBuf=null;
  formCover="";
  $("pdfDrop").classList.add("has-file");
  $("pdfDropName").textContent=f.name;
  $("pdfDropSize").textContent=fmtSize(f.size)+" ・ 表紙を生成中...";
  updateFormThumb();
  if(!$("fTitle").value.trim()){
    $("fTitle").value=f.name.replace(/\.pdf$/i,"");
  }
  var fr=new FileReader();
  fr.onload=function(){
    formPdfBuf=fr.result;
    generateCoverFromBuffer(formPdfBuf,function(uri){
      formCover=uri||"";
      updateFormThumb();
      $("pdfDropSize").textContent=fmtSize(f.size);
    });
  };
  fr.onerror=function(){
    $("pdfDropSize").textContent=fmtSize(f.size);
    toast("PDFを読み込めませんでした");
  };
  fr.readAsArrayBuffer(f);
};
$("btnCancel").onclick=function(){editingId?renderDetail(editingId):showView("vShelf")};
$("btnSave").onclick=function(){
  var title=$("fTitle").value.trim();
  if(!editingId&&!formPdfFile){toast("PDFファイルを選択してください");return}
  if(!title){toast("タイトルを入力してください");$("fTitle").focus();return}

  function finishSave(id,fileMeta,coverUri){
    var now=Date.now();
    if(editingId){
      var idx=books.findIndex(function(x){return x.id===editingId});
      if(idx>=0){
        var o=books[idx];
        o.title=title;
        if(coverUri)o.cover=coverUri;
        if(fileMeta){o.fileName=fileMeta.name;o.size=fileMeta.size;delete o._triedCover}
      }
    }else{
      books.push({
        id:id,
        title:title,
        cover:coverUri||"",
        fav:false,
        fileName:fileMeta?fileMeta.name:(title+".pdf"),
        size:fileMeta?fileMeta.size:0,
        createdAt:now,
        openedAt:now
      });
    }
    saveBooks(function(ok){
      if(!ok){toast("保存に失敗しました");return}
      renderShelf();
      renderDetail(id);
      toast("保存しました");
    });
  }

  var targetId=editingId||uid();
  if(formPdfFile){
    var saveWithBuf=function(buf){
      pdfPut(targetId,{data:buf,name:formPdfFile.name,size:formPdfFile.size,type:"application/pdf"},function(ok){
        if(!ok){toast("PDFの保存に失敗しました");return}
        if(formCover){
          finishSave(targetId,{name:formPdfFile.name,size:formPdfFile.size},formCover);
        }else{
          generateCoverFromBuffer(buf,function(uri){
            finishSave(targetId,{name:formPdfFile.name,size:formPdfFile.size},uri||"");
          });
        }
      });
    };
    if(formPdfBuf){
      saveWithBuf(formPdfBuf);
    }else{
      var fr=new FileReader();
      fr.onload=function(){saveWithBuf(fr.result)};
      fr.onerror=function(){toast("PDFを読み込めませんでした")};
      fr.readAsArrayBuffer(formPdfFile);
    }
  }else{
    finishSave(targetId,null,formCover);
  }
};

$("fReattach").onchange=function(){
  var f=this.files[0];this.value="";if(!f||!curId)return;
  var b=books.find(function(x){return x.id===curId});if(!b)return;
  var fr=new FileReader();
  fr.onload=function(){
    var buf=fr.result;
    pdfPut(b.id,{data:buf,name:f.name,size:f.size,type:"application/pdf"},function(ok){
      if(!ok){toast("PDFの保存に失敗しました");return}
      b.fileName=f.name;b.size=f.size;delete b._triedCover;
      generateCoverFromBuffer(buf,function(uri){
        if(uri)b.cover=uri;
        saveBooks();
        renderDetail(b.id);
        toast("PDFを紐付けました");
      });
    });
  };
  fr.readAsArrayBuffer(f);
};

$("btnExport").onclick=function(){
  $("menuSheet").hidden=true;
  if(!books.length){toast("書き出すデータがありません");return}
  lastExported=Date.now();
  metaPut("lastExported",lastExported);
  updateStorageStat();
  var payload=JSON.stringify({app:"recipe-shelf",version:1,exported:new Date().toISOString(),books:books},null,2);
  exportJson("recipe_shelf_"+todayStr()+".json",payload,books.length+"冊のデータを書き出しました");
};
$("btnImport").onclick=function(){$("menuSheet").hidden=true;$("fImport").click()};
$("fImport").onchange=function(){
  var f=this.files[0];this.value="";if(!f)return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var j=JSON.parse(fr.result);
      var arr=Array.isArray(j)?j:j.books;
      if(!Array.isArray(arr))throw 0;
      var n=0;
      arr.forEach(function(item){
        if(!item||!item.title)return;
        var rec={
          id:item.id||uid(),
          title:String(item.title),
          cover:item.cover||"",
          fav:!!item.fav,
          fileName:item.fileName||"",
          size:item.size||0,
          createdAt:item.createdAt||Date.now(),
          openedAt:item.openedAt||0
        };
        var idx=books.findIndex(function(x){return x.id===rec.id});
        if(idx>=0)books[idx]=rec;else books.push(rec);
        n++;
      });
      saveBooks();
      renderShelf();
      showView("vShelf");
      backfillCovers();
      toast(n+"冊のデータを読み込みました");
    }catch(e){toast("読み込めないファイルです")}
  };
  fr.readAsText(f);
};

// ---- Init ----
openDB(function(){
  metaGetAll(function(res){
    books=Array.isArray(res.books)?res.books:[];
    if(res.viewMode==="list"||res.viewMode==="grid")viewMode=res.viewMode;
    if(["opened","added","title"].indexOf(res.sortMode)>=0)sortMode=res.sortMode;
    $("sortSel").value=sortMode;
    lastExported=res.lastExported||0;
    renderShelf();
    backfillCovers();
  });
});
})();
</script>
